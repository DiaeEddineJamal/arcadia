# Keep Gradle running efficiently
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.parallel=false

# Limit workers to avoid many Java processes
org.gradle.workers.max=2

# Reduce RAM usage for Java/Gradle
# Note: MaxPermSize removed - not supported in Java 8+ (removed in Java 8, using JDK 21)
# Reduced heap size for better compatibility
org.gradle.jvmargs=-Xmx1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Improve incremental builds
android.useAndroidX=true
android.enableJetifier=true